const PIECE_SETS = {
  classic: { label: 'Classic' },
  outline: { label: 'Outline' },
  neo:     { label: 'Neo' },
  letters: { label: 'Letters' },
};

// The inner HTML of one piece, in whichever set is active.
function pieceMarkup(piece) {
  const t = piece[1];
  if (pieceSet === 'neo')
    return `<svg viewBox="0 0 45 45" aria-hidden="true">${NEO_PATHS[t]}</svg>`;
  if (pieceSet === 'letters')
    return `<span class="chip">${t}</span>`;
  return PIECES[piece];
}

function pieceElement(piece) {
  const el = document.createElement('div');
  el.className = 'piece';
  el.dataset.color = piece[0];
  if (pieceSet === 'classic' || pieceSet === 'outline') el.textContent = PIECES[piece];
  else el.innerHTML = pieceMarkup(piece);
  return el;
}

// Ten levels, weakened from the top down by three dials: how deep it looks,
// how far below best it is willing to play (randomness, in centipawns), and how
// often it throws a move away entirely (blunder).
//
// The Elo figures are ESTIMATES from the settings, not measurements against
// rated opposition — see the README. They exist to give the numbers meaning,
// not to claim precision.
const LEVELS = [
  { level: 1,  elo: 800,  maxDepth: 1,  maxTimeMs: 100,  randomness: 220, blunder: 0.22 },
  { level: 2,  elo: 950,  maxDepth: 1,  maxTimeMs: 150,  randomness: 170, blunder: 0.14 },
  { level: 3,  elo: 1100, maxDepth: 2,  maxTimeMs: 200,  randomness: 130, blunder: 0.08 },
  { level: 4,  elo: 1250, maxDepth: 2,  maxTimeMs: 300,  randomness: 100, blunder: 0.04 },
  { level: 5,  elo: 1400, maxDepth: 3,  maxTimeMs: 400,  randomness: 75,  blunder: 0.015 },
  { level: 6,  elo: 1550, maxDepth: 4,  maxTimeMs: 600,  randomness: 50,  blunder: 0 },
  { level: 7,  elo: 1700, maxDepth: 5,  maxTimeMs: 900,  randomness: 30,  blunder: 0 },
  { level: 8,  elo: 1800, maxDepth: 6,  maxTimeMs: 1200, randomness: 15,  blunder: 0 },
  { level: 9,  elo: 1950, maxDepth: 8,  maxTimeMs: 2000, randomness: 0,   blunder: 0 },
  { level: 10, elo: 2100, maxDepth: 64, maxTimeMs: 3000, randomness: 0,   blunder: 0 },
];
const levelOpts = () => LEVELS[level - 1];

// Bump on every edit so it is obvious from the page whether a change landed.
const VERSION = '2.7.0';

const $ = id => document.getElementById(id);

let pos;                    // current position (mutated in place by Engine.make)
let history;                // [{ move, undo, san }] — enough to unmake back to the start
let startFEN, startInfo;    // position the game began from, for PGN and numbering
let selected, legalFromSelected, cursorSq;
let flipped, gameMode, humanColor, level;
let result;                 // null, or { type, winner, text }
let thinking, searchId, lastInfo;
let promotionPending;
let boardTheme, pieceSet;
let drag = null;            // in-flight pointer drag, see onPointerDown
let suppressClick = false;  // set when a drag has already handled the gesture
let endShown;               // the closing animation plays once per game

// ── engine driver: a worker when the browser allows one, otherwise a
// depth-at-a-time search on the main thread so the page still repaints ──
let worker = null;
let pendingSearch = null, watchdog = null;
try {
  const src = '(' + ChessEngine.toString() + ')().workerMain();';
  worker = new Worker(URL.createObjectURL(new Blob([src], { type: 'text/javascript' })));
  worker.onerror = () => abandonWorker();
} catch (e) {
  worker = null;             // file:// in Chrome blocks blob workers
}

// Iterative deepening one depth per macrotask, so the page keeps repainting.
function runLocalSearch(req) {
  const { id, opts, onInfo, onDone } = req;
  const local = Engine.fromFEN(req.fen);
  local.repLo = req.repLo.slice(); local.repHi = req.repHi.slice();
  const end = Date.now() + opts.maxTimeMs;
  let depth = 1, best = null;
  const step = () => {
    if (id !== searchId) return;             // a stale search we no longer want
    const remaining = end - Date.now();
    if (depth > opts.maxDepth || remaining <= 0) return onDone(best || { move: 0 });
    const res = Engine.search(local, { ...opts, maxDepth: depth, maxTimeMs: remaining },
                              info => onInfo({ ...info, id }));
    if (res.move) best = res;
    if (depth >= opts.maxDepth || Math.abs(res.score) > 29000) return onDone(best);
    depth++;
    setTimeout(step, 0);
  };
  setTimeout(step, 0);
}

// A worker that throws, or goes quiet, would otherwise leave the spinner up for
// ever with no way back but a reload. Drop it and finish on the main thread.
function abandonWorker() {
  const req = pendingSearch;
  pendingSearch = null;
  clearTimeout(watchdog);
  worker = null;
  if (req && req.id === searchId) runLocalSearch(req);
}

function requestSearch(onInfo, onDone) {
  const req = {
    id: ++searchId,
    opts: levelOpts(),
    fen: Engine.toFEN(pos),
    repLo: pos.repLo.slice(),
    repHi: pos.repHi.slice(),
    onInfo, onDone,
  };
  if (!worker) return runLocalSearch(req);

  pendingSearch = req;
  clearTimeout(watchdog);
  watchdog = setTimeout(abandonWorker, req.opts.maxTimeMs + 4000);
  worker.onmessage = e => {
    const d = e.data;
    if (d.id !== req.id) return;
    if (d.type === 'info') { onInfo(d); return; }
    if (d.type === 'bestmove') {
      clearTimeout(watchdog);
      pendingSearch = null;
      onDone(d);
    }
  };
  worker.postMessage({ cmd: 'search', id: req.id, fen: req.fen,
                       repLo: req.repLo, repHi: req.repHi, opts: req.opts });
}

// ── game lifecycle ─────────────────────────────────────────────
function newGame(fen, opts) {
  pos = fen ? Engine.fromFEN(fen) : Engine.newPosition();
  startFEN = Engine.toFEN(pos);
  startInfo = { num: pos.full, whiteFirst: pos.turn === 'w' };
  history = [];
  selected = null;
  legalFromSelected = [];
  cursorSq = pos.turn === 'w' ? 52 : 12;
  result = null;
  thinking = false;
  searchId = (searchId || 0) + 1;
  pendingSearch = null;
  clearTimeout(watchdog);
  lastInfo = null;
  promotionPending = null;
  endShown = false;
  closeEndOverlay();
  flipped = humanColor === 'b' && gameMode === 'cpu';
  Engine.clearTT();
  if (worker) worker.postMessage({ cmd: 'clear' });
  render();
  // A position can arrive already finished — an imported FEN of a mate, say —
  // so settle the result before handing over to the computer.
  const ending = Engine.gameResult(pos);
  if (ending) { finishGame(ending); return; }
  if (!(opts && opts.noCpu)) maybeStartCpu();
}

const cpuColor = () => Engine.other(humanColor);
const cpuToMove = () => gameMode === 'cpu' && pos.turn === cpuColor();
const humanToMove = () => !result && !thinking && !promotionPending &&
                          (gameMode === 'pvp' || pos.turn === humanColor);

function maybeStartCpu() {
  if (result || !cpuToMove()) return;
  thinking = true;
  lastInfo = null;
  render();
  requestSearch(
    info => {
      if (!thinking) return;
      lastInfo = info;
      renderEngineInfo();
    },
    done => {
      thinking = false;
      if (!done || !done.move) { render(); return; }
      applyMove(done.move);
    });
}

// Applies a move to the live position and records what is needed to take it back.
function applyMove(move) {
  const san = Engine.toSAN(pos, move);
  const mover = pos.turn === 'w' ? 'White' : 'Black';
  const undo = Engine.make(pos, move);
  history.push({ move, undo, san });
  announce(`${mover} plays ${san}`);
  selected = null;
  legalFromSelected = [];
  cursorSq = Engine.mTo(move);
  const ending = Engine.gameResult(pos);
  if (ending) { finishGame(ending); return; }
  render();
  maybeStartCpu();
}

// Every way a game can end funnels through here, so the closing animation
// fires exactly once however the result arrived.
function finishGame(res) {
  result = describeResult(res);
  endShown = false;
  render();
  if (result) { announce(result.text); showGameEnd(result); }
}

function describeResult(res) {
  if (!res) return null;
  const name = c => c === 'w' ? 'White' : 'Black';
  const text = {
    checkmate: () => `Checkmate — ${name(res.winner)} wins`,
    stalemate: () => 'Stalemate — draw',
    fifty:     () => 'Draw — 50-move rule',
    repetition:() => 'Draw — threefold repetition',
    material:  () => 'Draw — insufficient material',
    resign:    () => `${name(res.winner)} wins by resignation`,
    agreed:    () => 'Draw agreed',
  }[res.type];
  return { ...res, text: text ? text() : 'Game over' };
}

function undoMove() {
  if (!history.length) return;
  searchId++;                    // abandon any search in flight
  pendingSearch = null;
  clearTimeout(watchdog);
  thinking = false;
  const popOne = () => {
    const h = history.pop();
    Engine.unmake(pos, h.move, h.undo);
  };
  popOne();
  // In CPU mode keep going back until it is the human's turn again.
  if (gameMode === 'cpu') while (history.length && pos.turn !== humanColor) popOne();
  selected = null;
  legalFromSelected = [];
  result = null;
  promotionPending = null;
  lastInfo = null;
  endShown = false;
  closeEndOverlay();
  render();
}

// ── board interaction ──────────────────────────────────────────
function movesFrom(sq) {
  return Engine.legalMoves(pos).filter(m => Engine.mFrom(m) === sq);
}

function selectSquare(sq) {
  const p = pos.b[sq];
  if (p && p[0] === pos.turn) {
    selected = sq;
    legalFromSelected = movesFrom(sq);
  } else {
    selected = null;
    legalFromSelected = [];
  }
  render();
}

function tryMoveTo(sq) {
  const candidates = legalFromSelected.filter(m => Engine.mTo(m) === sq);
  if (!candidates.length) return false;
  if (candidates.length > 1 && Engine.mPromo(candidates[0])) {
    showPromotion(candidates);
    return true;
  }
  applyMove(candidates[0]);
  return true;
}

function onSquareActivate(sq) {
  if (!humanToMove()) return;
  if (selected !== null && tryMoveTo(sq)) return;
  selectSquare(sq);
}

// ── rendering ──────────────────────────────────────────────────
const displayToSq = i => flipped ? 63 - i : i;

function render() {
  renderBoard();
  renderPanel();
  renderMoveList();
  renderEngineInfo();
}

function renderBoard() {
  const boardEl = $('board');
  boardEl.innerHTML = '';

  const files = flipped ? [...Engine.FILES].reverse() : [...Engine.FILES];
  const top = $('file-labels-top'), bot = $('file-labels-bot'), ranks = $('rank-labels');
  top.innerHTML = bot.innerHTML = ranks.innerHTML = '';
  files.forEach(f => {
    for (const row of [top, bot]) {
      const el = document.createElement('div');
      el.className = 'coord-label';
      el.textContent = f;
      row.appendChild(el);
    }
  });
  for (let i = 0; i < 8; i++) {
    const el = document.createElement('div');
    el.className = 'rank-label';
    el.textContent = flipped ? i + 1 : 8 - i;
    ranks.appendChild(el);
  }

  const dests = new Set(legalFromSelected.map(m => Engine.mTo(m)));
  const last = history.length ? history[history.length - 1].move : null;
  const checkedKing = Engine.inCheck(pos, pos.turn) ? Engine.kingSq(pos, pos.turn) : -1;
  const matedKing = result && result.type === 'checkmate' ? Engine.kingSq(pos, pos.turn) : -1;

  for (let i = 0; i < 64; i++) {
    const sq = displayToSq(i);
    const r = Engine.rankOf(sq), c = Engine.fileOf(sq);
    const el = document.createElement('div');
    el.className = `square ${(r + c) % 2 === 0 ? 'light' : 'dark'}`;
    el.dataset.sq = sq;
    el.id = 'sq-' + Engine.sqName(sq);
    el.setAttribute('role', 'gridcell');
    el.setAttribute('aria-label', describeSquare(sq, dests.has(sq)));
    el.setAttribute('aria-selected', selected === sq ? 'true' : 'false');

    if (last !== null && Engine.mFrom(last) === sq) el.classList.add('last-move-from');
    if (last !== null && Engine.mTo(last) === sq) el.classList.add('last-move-to');
    if (selected === sq) el.classList.add('selected');
    if (cursorSq === sq) el.classList.add('cursor');
    if (sq === checkedKing) el.classList.add('in-check');
    if (sq === matedKing) el.classList.add('mated');
    if (dests.has(sq)) {
      el.classList.add('move-hint');
      if (pos.b[sq]) el.classList.add('has-piece');
    }

    const p = pos.b[sq];
    if (p) el.appendChild(pieceElement(p));

    el.addEventListener('pointerdown', ev => onPointerDown(ev, sq));
    el.addEventListener('click', () => {
      // A drag that moved a piece already did the work; swallow the click the
      // browser sends afterwards.
      if (suppressClick) { suppressClick = false; return; }
      onSquareActivate(sq);
    });
    boardEl.appendChild(el);
  }
  boardEl.setAttribute('aria-activedescendant', 'sq-' + Engine.sqName(cursorSq));
}

const PIECE_NAMES = { P: 'pawn', N: 'knight', B: 'bishop', R: 'rook', Q: 'queen', K: 'king' };

// What a screen reader reads out for one square.
function describeSquare(sq, isDestination) {
  const name = Engine.sqName(sq);
  const p = pos.b[sq];
  let text = p
    ? `${name}, ${p[0] === 'w' ? 'white' : 'black'} ${PIECE_NAMES[p[1]]}`
    : `${name}, empty`;
  if (selected === sq) text += ', selected';
  if (isDestination) text += p ? ', can be captured' : ', legal move';
  return text;
}

function announce(text) {
  const el = $('announcer');
  if (el) el.textContent = text;
}

function renderPanel() {
  const turnDot = $('turn-dot'), turnText = $('turn-text');
  turnDot.style.background = pos.turn === 'w' ? '#f0f0e0' : '#222';
  turnDot.style.boxShadow = pos.turn === 'w' ? '0 0 8px #f0f0e0' : '0 0 8px #555';

  // With the status box gone, this single line carries whose turn it is plus
  // anything that overrides it: check, the computer thinking, or the result.
  let line;
  if (result) line = result.text;
  else if (thinking) line = 'CPU thinking…';
  else {
    line = (pos.turn === 'w' ? 'White' : 'Black') + "'s turn";
    if (Engine.inCheck(pos, pos.turn)) line += ' — Check!';
  }
  turnText.textContent = line;

  // Captured lists are derived from the undo records, so they follow takebacks.
  const takenBy = { w: [], b: [] };
  for (const h of history) if (h.undo.captured) takenBy[Engine.other(h.undo.captured[0])].push(h.undo.captured);

  // Each player's haul sits on the side of the board their own pieces are on,
  // so it swaps over when the board is flipped.
  const bottomColor = flipped ? 'b' : 'w';
  const topColor = Engine.other(bottomColor);
  const sideName = c => c === 'w' ? 'White' : 'Black';
  $('capture-top-title').textContent = 'Captured by ' + sideName(topColor);
  $('capture-bottom-title').textContent = 'Captured by ' + sideName(bottomColor);
  $('capture-top').textContent = takenBy[topColor].map(p => PIECES[p]).join('');
  $('capture-bottom').textContent = takenBy[bottomColor].map(p => PIECES[p]).join('');

  $('thinking').classList.toggle('active', thinking);
  $('btn-undo').disabled = history.length === 0;
  $('btn-resign').disabled = !!result;
  $('btn-draw').disabled = !!result;
  $('side-section').style.display = gameMode === 'cpu' ? '' : 'none';
  $('difficulty-section').style.display = gameMode === 'cpu' ? '' : 'none';
}

function renderMoveList() {
  const list = $('move-list');
  list.innerHTML = '';
  let num = startInfo.num;
  let i = 0;
  if (!startInfo.whiteFirst && history.length) {
    const entry = document.createElement('div');
    entry.className = 'move-entry';
    entry.innerHTML = `<span class="move-num">${num}.</span><span class="move-w">…</span>` +
                      `<span class="move-b">${history[0].san}</span>`;
    list.appendChild(entry);
    i = 1; num++;
  }
  for (; i < history.length; i += 2) {
    const entry = document.createElement('div');
    entry.className = 'move-entry';
    entry.innerHTML = `<span class="move-num">${num}.</span>` +
                      `<span class="move-w">${history[i].san}</span>` +
                      `<span class="move-b">${history[i + 1] ? history[i + 1].san : ''}</span>`;
    list.appendChild(entry);
    num++;
  }
  list.scrollTop = list.scrollHeight;
}

function renderEngineInfo() {
  const el = $('engine-info');
  if (!lastInfo) { el.textContent = ''; return; }
  const cp = lastInfo.score;
  const shown = Math.abs(cp) > 29000
    ? 'mate in ' + Math.ceil((30000 - Math.abs(cp)) / 2)
    : (cp >= 0 ? '+' : '') + (cp / 100).toFixed(2);
  el.textContent = `depth ${lastInfo.depth} · ${shown} · ${(lastInfo.nodes / 1000).toFixed(0)}k nodes` +
                   (lastInfo.pv && lastInfo.pv.length ? ` · ${lastInfo.pv.slice(0, 4).join(' ')}` : '');
}

// ── dialogs ────────────────────────────────────────────────────
function closeOverlay() {
  const el = document.querySelector('.promo-overlay');
  if (el) el.remove();
}

function overlay(innerHTML) {
  closeOverlay();
  const el = document.createElement('div');
  el.className = 'promo-overlay';
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.innerHTML = innerHTML;
  el.addEventListener('click', ev => { if (ev.target === el) { closeOverlay(); promotionPending = null; render(); } });
  document.body.appendChild(el);
  return el;
}

function showPromotion(candidates) {
  promotionPending = candidates;
  const col = pos.turn;
  const choices = candidates
    .slice()
    .sort((a, b) => Engine.mPromo(b) - Engine.mPromo(a))
    .map(m => {
      const t = Engine.PROMO_CHARS[Engine.mPromo(m)];
      return `<div class="promo-piece" data-move="${m}" aria-label="Promote to ${PIECE_NAMES[t]}">` +
             `<div class="piece" data-color="${col}">${pieceMarkup(col + t)}</div></div>`;
    }).join('');
  const el = overlay(`<div class="promo-box"><h2>Promote Pawn</h2>
    <div class="promo-choices">${choices}</div></div>`);
  el.querySelectorAll('.promo-piece').forEach(node => {
    node.addEventListener('click', () => {
      const move = +node.dataset.move;
      closeOverlay();
      promotionPending = null;
      applyMove(move);
    });
  });
  render();
}

function buildPGN() {
  const tags = [
    ['Event', 'Casual Game'],
    ['Site', 'Chess'],
    ['Date', new Date().toISOString().slice(0, 10).replace(/-/g, '.')],
    ['Round', '-'],
    ['White', gameMode === 'cpu' ? (humanColor === 'w' ? 'Player' : 'Computer') : 'White'],
    ['Black', gameMode === 'cpu' ? (humanColor === 'b' ? 'Player' : 'Computer') : 'Black'],
    ['Result', resultTag()],
  ];
  if (startFEN !== Engine.START_FEN) { tags.push(['SetUp', '1']); tags.push(['FEN', startFEN]); }

  const start = Engine.fromFEN(startFEN);
  let num = start.full, i = 0, out = [];
  if (start.turn === 'b' && history.length) { out.push(num + '...' + history[0].san); i = 1; num++; }
  for (; i < history.length; i += 2) {
    out.push(num + '.' + history[i].san + (history[i + 1] ? ' ' + history[i + 1].san : ''));
    num++;
  }
  out.push(resultTag());

  // Wrap the movetext at 80 columns, as PGN readers expect.
  const lines = [];
  let line = '';
  for (const tok of out.join(' ').split(' ')) {
    if (line.length + tok.length + 1 > 80) { lines.push(line); line = ''; }
    line += (line ? ' ' : '') + tok;
  }
  if (line) lines.push(line);

  return tags.map(([k, v]) => `[${k} "${v}"]`).join('\n') + '\n\n' + lines.join('\n') + '\n';
}

function resultTag() {
  if (!result) return '*';
  if (result.winner === 'w') return '1-0';
  if (result.winner === 'b') return '0-1';
  return '1/2-1/2';
}

function showExport() {
  const text = 'FEN\n' + Engine.toFEN(pos) + '\n\nPGN\n' + buildPGN();
  const el = overlay(`<div class="promo-box dialog"><h2>Export</h2>
    <textarea id="export-text" readonly></textarea>
    <div class="btn-row">
      <button class="btn" id="copy-fen">Copy FEN</button>
      <button class="btn" id="copy-pgn">Copy PGN</button>
      <button class="btn" id="close-dialog">Close</button>
    </div>
    <div class="err" id="dialog-msg"></div></div>`);
  $('export-text').value = text;
  const copy = (what, value) => {
    const ta = $('export-text');
    ta.value = value; ta.select();
    let ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    if (!ok && navigator.clipboard) { navigator.clipboard.writeText(value).catch(() => {}); ok = true; }
    $('dialog-msg').textContent = ok ? what + ' copied' : 'Copy failed — select the text and copy manually';
    $('dialog-msg').style.color = ok ? 'var(--text-dim)' : 'var(--check)';
    setTimeout(() => { ta.value = text; }, 1200);
  };
  $('copy-fen').addEventListener('click', () => copy('FEN', Engine.toFEN(pos)));
  $('copy-pgn').addEventListener('click', () => copy('PGN', buildPGN()));
  $('close-dialog').addEventListener('click', closeOverlay);
}

function showImport() {
  overlay(`<div class="promo-box dialog"><h2>Import</h2>
    <textarea id="import-text" placeholder="Paste a FEN or a PGN"></textarea>
    <div class="btn-row">
      <button class="btn" id="do-import">Load</button>
      <button class="btn" id="close-dialog">Cancel</button>
    </div>
    <div class="err" id="dialog-msg"></div></div>`);
  $('close-dialog').addEventListener('click', closeOverlay);
  $('do-import').addEventListener('click', () => {
    const text = $('import-text').value.trim();
    try {
      if (!text) throw new Error('Nothing to load');
      if (/^\[|\d+\s*\.\s*[A-Za-z]/.test(text) && !looksLikeFEN(text)) loadPGN(text);
      else loadFEN(text);
      closeOverlay();
    } catch (err) {
      $('dialog-msg').textContent = err.message;
    }
  });
}

const looksLikeFEN = t => /^\s*([rnbqkpRNBQKP1-8]+\/){7}[rnbqkpRNBQKP1-8]+\s+[wb]\s/.test(t);

function loadFEN(text) {
  const fen = text.split('\n').map(s => s.trim()).find(looksLikeFEN);
  if (!fen) throw new Error('No FEN found in that text');
  const test = Engine.fromFEN(fen);           // throws on anything malformed
  searchId++;
  thinking = false;
  newGame(Engine.toFEN(test));
}

function loadPGN(text) {
  const fenTag = /\[FEN\s+"([^"]+)"\]/.exec(text);
  const body = text.replace(/\[[^\]]*\]/g, ' ')          // tag pairs
                   .replace(/\{[^}]*\}/g, ' ')           // comments
                   .replace(/;[^\n]*/g, ' ')             // rest-of-line comments
                   .replace(/\$\d+/g, ' ')               // NAGs
                   .replace(/\([^()]*\)/g, ' ');         // one level of variations

  const tokens = body.split(/\s+/).filter(Boolean)
    .filter(t => !/^\d+\.*$/.test(t))                    // move numbers
    .filter(t => !/^(1-0|0-1|1\/2-1\/2|\*)$/.test(t))
    .map(t => t.replace(/^\d+\.+/, ''))
    .filter(Boolean);

  const fresh = fenTag ? Engine.fromFEN(fenTag[1]) : Engine.newPosition();
  const replay = [];
  for (const tok of tokens) {
    const move = Engine.sanToMove(fresh, tok);
    if (!move) throw new Error(`Could not play "${tok}" (move ${replay.length + 1})`);
    replay.push({ move, san: Engine.toSAN(fresh, move) });
    Engine.make(fresh, move);
  }

  searchId++;
  thinking = false;
  newGame(fenTag ? fenTag[1] : Engine.START_FEN, { noCpu: true });
  for (const step of replay) {
    const undo = Engine.make(pos, step.move);
    history.push({ move: step.move, undo, san: step.san });
  }
  const ending = Engine.gameResult(pos);
  if (ending) { finishGame(ending); return; }
  render();
  maybeStartCpu();
}

// win / loss / draw, from the point of view of the person at the keyboard.
function outcomeFor(res) {
  if (!res.winner) return 'draw';
  if (gameMode === 'cpu') return res.winner === humanColor ? 'win' : 'loss';
  return 'win';
}

function closeEndOverlay() {
  const el = document.querySelector('.endgame-overlay');
  if (el) el.remove();
}

const CONFETTI_COLORS = ['#c9a84c', '#f0d9b5', '#e8d5a3', '#8a7355', '#fff6d8'];

function showGameEnd(res) {
  if (endShown) return;
  endShown = true;
  const kind = outcomeFor(res);
  const loser = res.winner ? Engine.other(res.winner) : null;

  const glyph = kind === 'draw' ? '½'
    : kind === 'win' ? PIECES[(gameMode === 'cpu' ? humanColor : res.winner) + 'K']
    : PIECES[(gameMode === 'cpu' ? humanColor : loser) + 'K'];

  const title = kind === 'win' ? (gameMode === 'cpu' ? 'Victory' : (res.winner === 'w' ? 'White wins' : 'Black wins'))
    : kind === 'loss' ? 'Defeat'
    : 'Draw';

  closeEndOverlay();
  const el = document.createElement('div');
  el.className = 'endgame-overlay ' + kind;
  el.setAttribute('role', 'dialog');
  el.setAttribute('aria-modal', 'true');
  el.setAttribute('aria-label', title + '. ' + res.text);
  el.innerHTML = `<div class="endgame-card">
      <div class="endgame-glyph">${glyph}</div>
      <div class="endgame-title">${title}</div>
      <div class="endgame-sub">${res.text}</div>
      <div class="endgame-actions">
        <button class="btn" id="eg-new">New Game</button>
        <button class="btn" id="eg-close">View Board</button>
      </div>
    </div>`;
  el.addEventListener('click', ev => { if (ev.target === el) closeEndOverlay(); });
  document.body.appendChild(el);
  $('eg-new').addEventListener('click', () => { closeEndOverlay(); newGame(); });
  $('eg-close').addEventListener('click', closeEndOverlay);

  if (kind === 'win') rainConfetti(el);
}

function rainConfetti(host) {
  const reduced = typeof window !== 'undefined' && window.matchMedia &&
                  window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced) return;
  for (let i = 0; i < 70; i++) {
    const bit = document.createElement('div');
    bit.className = 'confetti';
    bit.style.left = (Math.random() * 100).toFixed(2) + '%';
    bit.style.background = CONFETTI_COLORS[i % CONFETTI_COLORS.length];
    bit.style.animationDuration = (2.2 + Math.random() * 2.2).toFixed(2) + 's';
    bit.style.animationDelay = (Math.random() * 1.4).toFixed(2) + 's';
    bit.style.transform = 'rotate(' + Math.floor(Math.random() * 360) + 'deg)';
    host.appendChild(bit);
  }
}

function showMessage(title, body) {
  overlay(`<div class="promo-box dialog"><h2>${title}</h2>
    <div style="max-width:360px;line-height:1.6">${body}</div>
    <div class="btn-row"><button class="btn" id="close-dialog">Close</button></div></div>`);
  $('close-dialog').addEventListener('click', closeOverlay);
}

// ── controls ───────────────────────────────────────────────────
// Themes are per-browser conveniences; if storage is unavailable (private
// windows, blocked site data) the page just falls back to the defaults.
function loadThemePrefs() {
  let savedBoard = null, savedPieces = null;
  try {
    savedBoard = localStorage.getItem('chess.boardTheme');
    savedPieces = localStorage.getItem('chess.pieceSet');
  } catch (e) { /* ignore */ }
  boardTheme = BOARD_THEMES[savedBoard] ? savedBoard : 'walnut';
  pieceSet = PIECE_SETS[savedPieces] ? savedPieces : 'classic';
}

function rememberThemePrefs() {
  try {
    localStorage.setItem('chess.boardTheme', boardTheme);
    localStorage.setItem('chess.pieceSet', pieceSet);
  } catch (e) { /* ignore */ }
}

function setBoardTheme(name) {
  if (!BOARD_THEMES[name]) return;
  boardTheme = name;
  const t = BOARD_THEMES[name];
  const root = document.documentElement.style;
  root.setProperty('--light', t.light);
  root.setProperty('--dark', t.dark);
  root.setProperty('--frame', t.frame);
  root.setProperty('--highlight', t.highlight);
  root.setProperty('--highlight-dark', t.highlightDark);
  root.setProperty('--check', t.check);
  rememberThemePrefs();
  renderThemeButtons();
}

function setPieceSet(name) {
  if (!PIECE_SETS[name]) return;
  pieceSet = name;
  document.body.dataset.pieces = name;
  rememberThemePrefs();
  render();                    // pieces are rebuilt from scratch
  renderThemeButtons();
}

function renderThemeButtons() {
  const boards = $('board-themes'), pieces = $('piece-themes');
  if (!boards || !pieces) return;

  boards.innerHTML = '';
  for (const [name, t] of Object.entries(BOARD_THEMES)) {
    const btn = document.createElement('button');
    btn.className = 'theme-btn' + (name === boardTheme ? ' active' : '');
    btn.dataset.board = name;
    btn.setAttribute('aria-pressed', name === boardTheme ? 'true' : 'false');
    btn.setAttribute('aria-label', t.label + ' board');
    btn.innerHTML = `<span class="swatch">
        <i style="background:${t.light}"></i><i style="background:${t.dark}"></i>
        <i style="background:${t.dark}"></i><i style="background:${t.light}"></i>
      </span><span>${t.label}</span>`;
    btn.addEventListener('click', () => setBoardTheme(name));
    boards.appendChild(btn);
  }

  pieces.innerHTML = '';
  for (const [name, set] of Object.entries(PIECE_SETS)) {
    const btn = document.createElement('button');
    btn.className = 'theme-btn' + (name === pieceSet ? ' active' : '');
    btn.dataset.pieceSet = name;
    // Each preview declares its own set, so a button can show a style the
    // board is not currently using.
    btn.dataset.pieces = name;
    btn.setAttribute('aria-pressed', name === pieceSet ? 'true' : 'false');
    btn.setAttribute('aria-label', set.label + ' pieces');
    const previous = pieceSet;
    pieceSet = name;
    btn.innerHTML = `<span class="piece" data-color="w">${pieceMarkup('wN')}</span>` +
                    `<span>${set.label}</span>`;
    pieceSet = previous;
    btn.addEventListener('click', () => setPieceSet(name));
    pieces.appendChild(btn);
  }
}

function setToggle(btn, on) {
  if (!btn) return;
  btn.classList.toggle('active', on);
  btn.setAttribute('aria-pressed', on ? 'true' : 'false');
}

function setMode(mode) {
  gameMode = mode;
  setToggle($('mode-cpu'), mode === 'cpu');
  setToggle($('mode-pvp'), mode === 'pvp');
  newGame();
}

function setSide(col) {
  humanColor = col;
  setToggle($('side-w'), col === 'w');
  setToggle($('side-b'), col === 'b');
  newGame();
}

function setLevel(n) {
  const wanted = Math.round(Number(n));
  if (!(wanted >= 1 && wanted <= LEVELS.length)) return;
  level = wanted;
  renderLevelButtons();
}

function renderLevelButtons() {
  const host = $('level-buttons');
  if (!host) return;
  host.innerHTML = '';
  for (const spec of LEVELS) {
    const btn = document.createElement('button');
    btn.className = 'diff-btn' + (spec.level === level ? ' active' : '');
    btn.dataset.level = String(spec.level);
    btn.textContent = String(spec.level);
    btn.setAttribute('aria-pressed', spec.level === level ? 'true' : 'false');
    btn.setAttribute('aria-label', `Level ${spec.level}, around ${spec.elo} Elo`);
    btn.addEventListener('click', () => setLevel(spec.level));
    host.appendChild(btn);
  }
  const spec = levelOpts();
  $('level-caption').textContent = `Level ${spec.level} · ~${spec.elo} Elo`;
}

function resign() {
  if (result) return;
  searchId++; thinking = false;
  const loser = gameMode === 'cpu' ? humanColor : pos.turn;
  finishGame({ type: 'resign', winner: Engine.other(loser) });
}

function offerDraw() {
  if (result) return;
  if (gameMode === 'pvp') {
    finishGame({ type: 'agreed', winner: null });
    return;
  }
  // The CPU accepts unless it thinks it is doing well.
  const evalForCpu = pos.turn === cpuColor() ? Engine.evaluate(pos) : -Engine.evaluate(pos);
  if (evalForCpu < 30) {
    finishGame({ type: 'agreed', winner: null });
  } else {
    showMessage('Draw offer', 'The computer declines and plays on.');
  }
}

function flipBoard() { flipped = !flipped; render(); }

// ── keyboard ───────────────────────────────────────────────────
document.addEventListener('keydown', ev => {
  if (ev.target.tagName === 'TEXTAREA' || ev.target.tagName === 'INPUT') return;
  const overlayOpen = !!document.querySelector('.promo-overlay');
  const endOpen = !!document.querySelector('.endgame-overlay');
  if (ev.key === 'Escape') {
    if (endOpen) closeEndOverlay();
    else if (overlayOpen) { closeOverlay(); promotionPending = null; render(); }
    else { selected = null; legalFromSelected = []; render(); }
    return;
  }
  if (overlayOpen || endOpen) return;

  let dr = 0, dc = 0;
  if (ev.key === 'ArrowUp') dr = -1;
  else if (ev.key === 'ArrowDown') dr = 1;
  else if (ev.key === 'ArrowLeft') dc = -1;
  else if (ev.key === 'ArrowRight') dc = 1;
  else if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); onSquareActivate(cursorSq); return; }
  else if (ev.key === 'f' || ev.key === 'F') { flipBoard(); return; }
  else if (ev.key === 'u' || ev.key === 'U') { undoMove(); return; }
  else return;

  ev.preventDefault();
  if (flipped) { dr = -dr; dc = -dc; }
  const r = Math.min(7, Math.max(0, Engine.rankOf(cursorSq) + dr));
  const c = Math.min(7, Math.max(0, Engine.fileOf(cursorSq) + dc));
  cursorSq = Engine.sqOf(r, c);
  render();
});

// ── dragging ───────────────────────────────────────────────────
// Pointer events rather than HTML5 drag-and-drop, which never fires on touch.
// One code path covers mouse, finger and pen.
const DRAG_THRESHOLD = 6;   // px of travel before a press becomes a drag

function squareElAt(x, y) {
  if (typeof document.elementFromPoint !== 'function') return null;
  let node = document.elementFromPoint(x, y);
  while (node && !(node.dataset && node.dataset.sq !== undefined)) node = node.parentElement;
  return node;
}

function onPointerDown(ev, sq) {
  suppressClick = false;
  if (ev.button > 0) return;                       // left button / touch only
  const piece = pos.b[sq];
  if (!humanToMove() || !piece || piece[0] !== pos.turn) return;
  drag = { from: sq, piece, x: ev.clientX, y: ev.clientY, moved: false, ghost: null };
}

function onPointerMove(ev) {
  if (!drag) return;
  if (!drag.moved) {
    if (Math.abs(ev.clientX - drag.x) < DRAG_THRESHOLD &&
        Math.abs(ev.clientY - drag.y) < DRAG_THRESHOLD) return;
    drag.moved = true;
    if (selected !== drag.from) selectSquare(drag.from);
    const ghost = document.createElement('div');
    ghost.className = 'drag-ghost';
    ghost.appendChild(pieceElement(drag.piece));
    document.body.appendChild(ghost);
    drag.ghost = ghost;
    const src = document.querySelector('.square.selected .piece');
    if (src) src.classList.add('dragging');
  }
  ev.preventDefault();
  drag.ghost.style.left = ev.clientX + 'px';
  drag.ghost.style.top = ev.clientY + 'px';

  document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
  const over = squareElAt(ev.clientX, ev.clientY);
  if (over && legalFromSelected.some(m => Engine.mTo(m) === +over.dataset.sq))
    over.classList.add('drop-target');
}

function endDrag(ev, cancelled) {
  if (!drag) return;
  const wasDragging = drag.moved;
  const from = drag.from;
  if (drag.ghost) drag.ghost.remove();
  drag = null;
  document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
  document.querySelectorAll('.piece.dragging').forEach(el => el.classList.remove('dragging'));
  if (!wasDragging) return;                        // a plain click; let it through
  suppressClick = true;
  if (cancelled || !ev) { render(); return; }
  const over = squareElAt(ev.clientX, ev.clientY);
  const target = over ? +over.dataset.sq : -1;
  if (target < 0 || target === from || !humanToMove()) { render(); return; }
  if (!tryMoveTo(target)) render();                // an illegal drop keeps the selection
}

document.addEventListener('pointermove', onPointerMove, { passive: false });
document.addEventListener('pointerup', ev => endDrag(ev, false));
document.addEventListener('pointercancel', ev => endDrag(ev, true));

// ── wiring ─────────────────────────────────────────────────────
$('mode-cpu').addEventListener('click', () => setMode('cpu'));
$('mode-pvp').addEventListener('click', () => setMode('pvp'));
$('side-w').addEventListener('click', () => setSide('w'));
$('side-b').addEventListener('click', () => setSide('b'));
$('btn-new').addEventListener('click', () => newGame());
$('btn-undo').addEventListener('click', undoMove);
$('btn-flip').addEventListener('click', flipBoard);
$('btn-resign').addEventListener('click', resign);
$('btn-draw').addEventListener('click', offerDraw);
$('btn-export').addEventListener('click', showExport);
$('btn-import').addEventListener('click', showImport);

// ── boot ───────────────────────────────────────────────────────
gameMode = 'cpu';
humanColor = 'w';
level = 5;
searchId = 0;
loadThemePrefs();
document.body.dataset.pieces = pieceSet;
setBoardTheme(boardTheme);
$('version').textContent = 'v' + VERSION;
document.title = `Chess v${VERSION}`;
setLevel(5);
newGame();
</script>
</body>
</html>
